name: "tina4-nodejs CodeQL config"

# Scan the shipped framework (packages/*/src). Everything excluded below is
# non-shipped, so scanning it is only noise:
#   - test/        the test suite, not part of the published packages
#   - "**/dist"    build output
#   - "**/*.test.ts"  test files colocated with sources
#   - "**/public/js/frond.min.js"  vendored minified bundle (built from tina4-css)
paths-ignore:
  - test
  - "**/dist"
  - "**/*.test.ts"
  - "**/public/js/frond.min.js"
