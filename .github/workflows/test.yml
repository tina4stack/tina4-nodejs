name: Tests

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

jobs:
  test:
    runs-on: ubuntu-latest

    # Cache backends — the unified CacheBackend tests (test/cache-backends.test.ts)
    # exercise these for real; without them those checks self-skip. Ports mirror
    # the local docker harness. redis-auth uses requirepass s3cret.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis-auth:
        # Bitnami honours REDIS_PASSWORD → requirepass; the official redis image
        # has no env switch for auth and GH service containers can't override the
        # command, so Bitnami is the portable way to get a password-protected
        # Redis as a service.
        image: bitnami/redis:7.2
        ports:
          - 6381:6379
        env:
          REDIS_PASSWORD: s3cret
        options: >-
          --health-cmd "redis-cli -a s3cret ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # Node 22+ is required — packages/orm/src/adapters/sqlite.ts uses
      # `node:sqlite` (introduced in Node 22, stable in Node 24).
      # Node 20 fails with ERR_UNKNOWN_BUILTIN_MODULE.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Report results
        if: always()
        run: echo "Test run completed with exit code $?"
