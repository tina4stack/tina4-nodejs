name: Tests

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real-service test gate. Every backend the suite can touch runs for real in
    # CI so the integration tests execute instead of skipping (the gap that let
    # the Mongo-queue redelivery / migration bugs ship). Service containers are
    # health-checked, so the job fails if one never comes up. Ports mirror the
    # local docker harness (/tmp/tina4_infra_up.sh) so the same TINA4_TEST_*
    # values work locally and here. redis-auth uses requirepass s3cret.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        ports:
          - 55432:5432
        env:
          POSTGRES_USER: tina4
          POSTGRES_PASSWORD: tina4
          POSTGRES_DB: tina4_node
        options: >-
          --health-cmd "pg_isready -U tina4 -d tina4_node"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # MySQL 8 (#262). DB tina4_test, user tina4/tina4 created by the image env.
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: tina4_test
          MYSQL_USER: tina4
          MYSQL_PASSWORD: tina4
          MYSQL_ROOT_PASSWORD: tina4
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptina4"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # MSSQL 2022 (#262). The image starts with NO user database, so a later
      # step CREATEs tina4_test once the server is healthy.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: 'Y'
          SA_PASSWORD: 'TinaSQL123!Secure'
          MSSQL_PID: Developer
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      # Enable the real-service integration tests (they skip when unset). Ports
      # mirror the service containers above and the local docker harness.
      TINA4_TEST_PG_HOST: localhost
      TINA4_TEST_PG_PORT: '55432'
      TINA4_TEST_PG_USER: tina4
      TINA4_TEST_PG_PASS: tina4
      TINA4_TEST_PG_DB: tina4_node
      TINA4_TEST_PG_DB_2: tina4_py
      TINA4_TEST_POSTGRES_URL: postgres://tina4:tina4@localhost:55432/tina4_node
      # MySQL 8 + MSSQL 2022 (#262) — mirror the service containers above and the
      # local docker harness. The MySQL+MSSQL boolean round-trip test reads these.
      TINA4_TEST_MYSQL_HOST: localhost
      TINA4_TEST_MYSQL_PORT: '3306'
      TINA4_TEST_MYSQL_USER: tina4
      TINA4_TEST_MYSQL_PASS: tina4
      TINA4_TEST_MYSQL_DB: tina4_test
      TINA4_TEST_MSSQL_HOST: localhost
      TINA4_TEST_MSSQL_PORT: '1433'
      TINA4_TEST_MSSQL_USER: sa
      TINA4_TEST_MSSQL_PASS: 'TinaSQL123!Secure'
      TINA4_TEST_MSSQL_DB: tina4_test
      TINA4_TEST_MONGO_URL: mongodb://localhost:27017
      TINA4_MONGO_URI: mongodb://localhost:27017
      TINA4_TEST_REDIS_URL: redis://localhost:6379
      TINA4_TEST_VALKEY_URL: redis://localhost:6380
      TINA4_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
      TINA4_TEST_KAFKA_URL: localhost:9092
      TINA4_KAFKA_BROKERS: localhost:9092
      # Turn a missing provisioned service into a hard failure (no green skips).
      # The run-all.ts gate fails the run if a real-service test skips because a
      # PROVISIONED service was unavailable. MySQL/MSSQL joined the provisioned
      # set in #262; only Firebird is not provisioned, so its skips stay green.
      TINA4_REQUIRE_SERVICES: '1'

    steps:
      - uses: actions/checkout@v4

      # Password-protected Redis (requirepass s3cret) on 6381 for the credential
      # tests. GH service containers can't override the command, so run it as a
      # plain container (mirrors PHP/Ruby CI). The auth tests self-skip if absent.
      - name: Start password-protected Redis (redis-auth)
        run: |
          docker run -d --name redis-auth -p 6381:6379 redis:7 redis-server --requirepass s3cret
          for i in $(seq 1 15); do
            if docker exec redis-auth redis-cli -a s3cret ping 2>/dev/null | grep -q PONG; then
              echo "redis-auth ready"; break
            fi
            sleep 1
          done

      # Second Postgres database for the two-DB named-connection test
      # (test/bind-database.test.ts uses TINA4_TEST_PG_DB_2=tina4_py). The
      # service container only creates POSTGRES_DB=tina4_node, so add the other.
      - name: Create second Postgres database (tina4_py)
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=tina4 psql -h localhost -p 55432 -U tina4 -d tina4_node -c "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          PGPASSWORD=tina4 psql -h localhost -p 55432 -U tina4 -d tina4_node \
            -c "CREATE DATABASE tina4_py" || echo "tina4_py may already exist"

      # MSSQL 2022 (#262) starts with NO user database — create tina4_test once
      # the server is accepting connections. sqlcmd lives in the mssql container;
      # exec it there (the runner has no sqlcmd). The mssql-tools18 path needs -C
      # (trust self-signed cert); fall back to the legacy mssql-tools path.
      - name: Create MSSQL database (tina4_test)
        run: |
          CID=$(docker ps --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" --format '{{.ID}}' | head -n1)
          if [ -z "$CID" ]; then echo "MSSQL container not found"; docker ps; exit 1; fi
          run_sqlcmd() {
            docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -C "$@" 2>/dev/null \
              || docker exec "$CID" /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' "$@"
          }
          echo "Waiting for MSSQL to accept connections ..."
          for i in $(seq 1 60); do
            if run_sqlcmd -Q "SELECT 1" >/dev/null 2>&1; then echo "MSSQL ready after ${i}s"; break; fi
            sleep 2
          done
          run_sqlcmd -Q "IF DB_ID('tina4_test') IS NULL CREATE DATABASE tina4_test"
          echo "tina4_test database ensured"

      # Kafka in KRaft mode (single node, no ZooKeeper). GitHub service
      # containers can't express the KRaft listener config cleanly, so run it as
      # a plain container and FAIL the job if the broker never serves metadata.
      - name: Start Kafka (KRaft)
        run: |
          docker run -d --name tina4-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            apache/kafka:3.7.0
          echo "Waiting for Kafka to serve metadata on :9092 ..."
          for i in $(seq 1 60); do
            if docker exec tina4-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Kafka did not become ready in 60s"; docker logs tina4-kafka | tail -40; exit 1

      # Node 22+ is required — packages/orm/src/adapters/sqlite.ts uses
      # `node:sqlite` (introduced in Node 22, stable in Node 24).
      # Node 20 fails with ERR_UNKNOWN_BUILTIN_MODULE.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Report results
        if: always()
        run: echo "Test run completed with exit code $?"
