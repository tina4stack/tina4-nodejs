name: Tests

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real-service test gate. Every backend the suite can touch runs for real in
    # CI so the integration tests execute instead of skipping (the gap that let
    # the Mongo-queue redelivery / migration bugs ship). Service containers are
    # health-checked, so the job fails if one never comes up. Ports mirror the
    # local docker harness (/tmp/tina4_infra_up.sh) so the same TINA4_TEST_*
    # values work locally and here. redis-auth uses requirepass s3cret.
    services:
      # GreenMail: real SMTP 3025 + IMAP 3143 for the Messenger round-trip
      # tests. auth.disabled is REQUIRED, not laziness: every suite uses a unique
      # random recipient per test so each mailbox is created on FIRST ACCESS,
      # which cannot work against a server demanding pre-registered users.
      greenmail:
        image: greenmail/standalone:2.1.3
        ports: ['3025:3025', '3143:3143']
        env:
          GREENMAIL_OPTS: '-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled'
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6380:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      memcached:
        image: memcached:1.6
        ports:
          - 11211:11211
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })' --quiet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        ports:
          - 55432:5432
        env:
          POSTGRES_USER: tina4
          POSTGRES_PASSWORD: tina4
          POSTGRES_DB: tina4_node
        options: >-
          --health-cmd "pg_isready -U tina4 -d tina4_node"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # MySQL 8 (#262). DB tina4_test, user tina4/tina4 created by the image env.
      mysql:
        image: mysql:8
        ports:
          - 3306:3306
        env:
          MYSQL_DATABASE: tina4_test
          MYSQL_USER: tina4
          MYSQL_PASSWORD: tina4
          MYSQL_ROOT_PASSWORD: tina4
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptina4"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # MSSQL 2022 (#262). The image starts with NO user database, so a later
      # step CREATEs tina4_test once the server is healthy.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports:
          - 1433:1433
        env:
          ACCEPT_EULA: 'Y'
          SA_PASSWORD: 'TinaSQL123!Secure'
          MSSQL_PID: Developer
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      # Enable the real-service integration tests (they skip when unset). Ports
      # mirror the service containers above and the local docker harness.
      TINA4_TEST_PG_HOST: localhost
      TINA4_TEST_PG_PORT: '55432'
      TINA4_TEST_PG_USER: tina4
      TINA4_TEST_PG_PASS: tina4
      TINA4_TEST_PG_DB: tina4_node
      TINA4_TEST_PG_DB_2: tina4_py
      TINA4_TEST_POSTGRES_URL: postgres://tina4:tina4@localhost:55432/tina4_node
      # MySQL 8 + MSSQL 2022 (#262) — mirror the service containers above and the
      # local docker harness. The MySQL+MSSQL boolean round-trip test reads these.
      TINA4_TEST_MYSQL_HOST: localhost
      TINA4_TEST_MYSQL_PORT: '3306'
      TINA4_TEST_MYSQL_USER: tina4
      TINA4_TEST_MYSQL_PASS: tina4
      TINA4_TEST_MYSQL_DB: tina4_test
      TINA4_TEST_MSSQL_HOST: localhost
      TINA4_TEST_MSSQL_PORT: '1433'
      TINA4_TEST_MSSQL_USER: sa
      TINA4_TEST_MSSQL_PASS: 'TinaSQL123!Secure'
      TINA4_TEST_MSSQL_DB: tina4_test
      TINA4_TEST_MONGO_URL: mongodb://localhost:27017
      TINA4_MONGO_URI: mongodb://localhost:27017
      TINA4_TEST_REDIS_URL: redis://localhost:6379
      TINA4_TEST_VALKEY_URL: redis://localhost:6380
      TINA4_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
      TINA4_TEST_KAFKA_URL: localhost:9092
      TINA4_KAFKA_BROKERS: localhost:9092
      # MQTT 3.1.1 brokers started by the "Start MQTT brokers" step below;
      # TINA4_TEST_MQTT_CA_FILE is injected there once the certs are generated.
      TINA4_TEST_MQTT_URL: mqtt://127.0.0.1:1883
      TINA4_TEST_MQTT_AUTH_URL: mqtt://127.0.0.1:1884
      TINA4_TEST_MQTT_TLS_URL: mqtts://127.0.0.1:8883
      TINA4_TEST_MQTT_EMQX_URL: mqtt://127.0.0.1:1885
      TINA4_TEST_MQTT_USERNAME: tina4
      TINA4_TEST_MQTT_PASSWORD: testpass
      # Turn a missing provisioned service into a hard failure (no green skips).
      # The run-all.ts gate fails the run if a real-service test skips because a
      # PROVISIONED service was unavailable. MySQL/MSSQL joined the provisioned
      # set in #262; only Firebird is not provisioned, so its skips stay green.
      TINA4_REQUIRE_SERVICES: '1'

    steps:
      # The greenmail/standalone image is a bare JRE with no nc/curl, so a
      # container --health-cmd cannot run -- and a probe that cannot run looks
      # exactly like a broken service. Wait from the RUNNER instead and FAIL the
      # job if it never listens: the require-services gate now treats a
      # "greenmail not reachable" skip as fatal, so a silent no-show must be loud
      # here rather than surfacing as a confusing gate failure later.
      # shell: bash is mandatory -- /dev/tcp is a bash feature, absent in sh.
      - name: Wait for GreenMail (SMTP 3025 / IMAP 3143)
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/3025) 2>/dev/null \
               && (exec 4<>/dev/tcp/127.0.0.1/3143) 2>/dev/null; then
              echo "GreenMail ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "GreenMail did not become ready in 60s"; exit 1

      - uses: actions/checkout@v4

      # Password-protected Redis (requirepass s3cret) on 6381 for the credential
      # tests. GH service containers can't override the command, so run it as a
      # plain container (mirrors PHP/Ruby CI). The auth tests self-skip if absent.
      - name: Start password-protected Redis (redis-auth)
        run: |
          docker run -d --name redis-auth -p 6381:6379 redis:7 redis-server --requirepass s3cret
          for i in $(seq 1 15); do
            if docker exec redis-auth redis-cli -a s3cret ping 2>/dev/null | grep -q PONG; then
              echo "redis-auth ready"; break
            fi
            sleep 1
          done

      # Second Postgres database for the two-DB named-connection test
      # (test/bind-database.test.ts uses TINA4_TEST_PG_DB_2=tina4_py). The
      # service container only creates POSTGRES_DB=tina4_node, so add the other.
      - name: Create second Postgres database (tina4_py)
        run: |
          for i in $(seq 1 30); do
            if PGPASSWORD=tina4 psql -h localhost -p 55432 -U tina4 -d tina4_node -c "SELECT 1" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          PGPASSWORD=tina4 psql -h localhost -p 55432 -U tina4 -d tina4_node \
            -c "CREATE DATABASE tina4_py" || echo "tina4_py may already exist"

      # MSSQL 2022 (#262) starts with NO user database — create tina4_test once
      # the server is accepting connections. sqlcmd lives in the mssql container;
      # exec it there (the runner has no sqlcmd). The mssql-tools18 path needs -C
      # (trust self-signed cert); fall back to the legacy mssql-tools path.
      - name: Create MSSQL database (tina4_test)
        run: |
          CID=$(docker ps --filter "ancestor=mcr.microsoft.com/mssql/server:2022-latest" --format '{{.ID}}' | head -n1)
          if [ -z "$CID" ]; then echo "MSSQL container not found"; docker ps; exit 1; fi
          run_sqlcmd() {
            docker exec "$CID" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -C "$@" 2>/dev/null \
              || docker exec "$CID" /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' "$@"
          }
          echo "Waiting for MSSQL to accept connections ..."
          for i in $(seq 1 60); do
            if run_sqlcmd -Q "SELECT 1" >/dev/null 2>&1; then echo "MSSQL ready after ${i}s"; break; fi
            sleep 2
          done
          run_sqlcmd -Q "IF DB_ID('tina4_test') IS NULL CREATE DATABASE tina4_test"
          echo "tina4_test database ensured"

      # Kafka in KRaft mode (single node, no ZooKeeper). GitHub service
      # containers can't express the KRaft listener config cleanly, so run it as
      # a plain container and FAIL the job if the broker never serves metadata.
      - name: Start Kafka (KRaft)
        run: |
          docker run -d --name tina4-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            apache/kafka:3.7.0
          echo "Waiting for Kafka to serve metadata on :9092 ..."
          for i in $(seq 1 60); do
            if docker exec tina4-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Kafka did not become ready in 60s"; docker logs tina4-kafka | tail -40; exit 1

      # MQTT 3.1.1: Mosquitto (1883 anon / 1884 auth / 8883 TLS). The vendored
      # script generates certs + a password file, starts Mosquitto, and FAILS the
      # job if it does not come up - so the MQTT tests never skip green. EMQX (the
      # SUBACK-0x80 refusal path) is exercised only by the Ruby suite, so here it
      # is best-effort (MQTT_REQUIRE_EMQX=false: not started, never fatal).
      - name: Start MQTT brokers (Mosquitto 1883/1884/8883; EMQX best-effort)
        run: |
          MQTT_REQUIRE_EMQX=false bash test/mqtt-infra.sh "$RUNNER_TEMP/tina4-mqtt-infra"
          echo "TINA4_TEST_MQTT_CA_FILE=$RUNNER_TEMP/tina4-mqtt-infra/certs/ca.crt" >> "$GITHUB_ENV"

      # Node 22+ is required — packages/orm/src/adapters/sqlite.ts uses
      # `node:sqlite` (introduced in Node 22, stable in Node 24).
      # Node 20 fails with ERR_UNKNOWN_BUILTIN_MODULE.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Report results
        if: always()
        run: echo "Test run completed with exit code $?"

  # Dedicated live-Firebird job (systemic coverage-leak fix). Firebird is NOT a
  # provisioned service in the main `test` job above — its skips stay green there
  # BY DESIGN (EXCLUDED_KEYWORDS=["firebird"] in test/_serviceGate.ts), which is
  # correct for that already-heavy multi-service runner. The consequence, though,
  # was that the Firebird rollback/commit regression tests only ever SKIPPED in
  # CI — the exact gap that let the Firebird rollback no-op ship. This job stands
  # up a REAL Firebird 5.0.2, installs the node-firebird driver the adapter needs,
  # and RUNS the firebird tests against it. A NO-SILENT-SKIP guard fails the job
  # if the rollback test did not actually execute (a missing driver / unset URL /
  # unreachable server would otherwise self-exit 0 as a green skip). This is the
  # Node twin of the PHP `firebird:` job's `php -m | grep interbase` teeth.
  firebird:
    runs-on: ubuntu-latest
    env:
      TINA4_TEST_FIREBIRD_URL: firebird://SYSDBA:masterkey@localhost:3050//var/lib/firebird/data/test.fdb
    steps:
      - uses: actions/checkout@v4

      # Firebird 5.0.2 as a plain container (a GitHub `services:` block cannot
      # wait for Firebird's first-boot DB creation cleanly). FAIL the job if it
      # never accepts a query, so the coverage has teeth.
      - name: Start Firebird 5.0.2
        run: |
          docker run -d --name tina4-firebird -p 3050:3050 \
            -e FIREBIRD_ROOT_PASSWORD=masterkey \
            -e FIREBIRD_DATABASE=test.fdb \
            firebirdsql/firebird:5.0.2
          echo "Waiting for Firebird to accept connections on :3050 ..."
          for i in $(seq 1 30); do
            if docker exec tina4-firebird /opt/firebird/bin/isql -user SYSDBA -password masterkey \
                 /var/lib/firebird/data/test.fdb -q -o /dev/null <<<'SELECT 1 FROM RDB$DATABASE;' 2>/dev/null; then
              echo "Firebird ready after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "Firebird did not become ready in time"; docker logs tina4-firebird | tail -40; exit 1

      # Node 22+ — same version the main `test` job uses (node:sqlite needs 22).
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      # The Firebird adapter lazily require()s node-firebird; install it here.
      # It is NOT a core dependency (core stays zero-dependency), so the rollback
      # test SKIPs "node-firebird package not installed" without it — a skip the
      # guard below turns into a job failure.
      - name: Install node-firebird driver
        run: npm install node-firebird --no-save

      # Run the live-Firebird rollback/commit regression test and PROVE it RAN.
      # The test self-exits 0 on an all-SKIP run (Firebird is a non-provisioned
      # engine), so a plain exit code cannot tell "passed" from "green-skipped".
      # Strip ANSI, then assert: (a) no SKIP line, (b) the ROLLBACK-undoes-insert
      # negative case PASSed, (c) a summary of "0 failed, 0 skipped" over at
      # least one case. node-firebird missing / URL unset / server unreachable
      # each print a firebird SKIP and FAIL the job here — never a silent green
      # skip. This is the Node equivalent of PHP's `grep interbase`.
      #
      # The summary assertion pins the INVARIANT (everything ran, nothing failed,
      # nothing skipped), NOT a literal total. It used to grep for the exact
      # string "4 passed, 0 failed, 0 skipped"; the test then legitimately grew
      # to 7 cases and this job went red while every live case was passing. A
      # guard that a passing test can break is a guard that gets deleted.
      - name: Run Firebird rollback test against live Firebird (no-silent-skip guard)
        run: |
          set -o pipefail
          out=$(npx tsx test/firebirdRollback.test.ts 2>&1 | tee /dev/stderr)
          clean=$(printf '%s\n' "$out" | sed -E 's/\x1b\[[0-9;]*m//g')
          if printf '%s\n' "$clean" | grep -qw SKIP; then
            echo "::error::Firebird rollback test SKIPPED — the live-FB coverage did not run (driver/URL/server problem)."
            exit 1
          fi
          printf '%s\n' "$clean" | grep -q "PASS ROLLBACK undoes the insert (row gone)" || {
            echo "::error::The ROLLBACK-undoes-insert (negative) case did not PASS."; exit 1; }
          summary=$(printf '%s\n' "$clean" | grep -Eo '[0-9]+ passed, [0-9]+ failed, [0-9]+ skipped' | tail -1 || true)
          case "$summary" in
            *"0 failed, 0 skipped") ;;
            *) echo "::error::Firebird rollback test did not report '0 failed, 0 skipped' (got: '${summary:-no summary line}')."; exit 1 ;;
          esac
          passed=${summary%% passed*}
          [ "${passed:-0}" -ge 1 ] 2>/dev/null || {
            echo "::error::Firebird rollback test reported no passing cases (got: '${summary:-no summary line}')."; exit 1; }
          echo "Firebird rollback test RAN against live Firebird: $summary."

      # The remaining firebird test files also run in the main `test` job (they
      # are pure-logic), but run them here too for completeness. They self-exit
      # non-zero on failure. firebirdUrl's optional live block targets a local
      # dev port (53050), not this container's 3050, so it cleanly skips its live
      # portion while its pure normaliser assertions still run.
      - name: Run remaining Firebird test files
        run: |
          npx tsx test/firebirdCharset.test.ts
          npx tsx test/firebirdUrl.test.ts
