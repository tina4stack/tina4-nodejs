name: Publish to npm

on:
  push:
    tags:
      - '[0-9]*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    # Gate the publish behind a protected environment (ADR-0081); NPM_TOKEN
    # should live on the `release` environment, with required reviewers / a tag
    # deployment-branch rule configured in Settings -> Environments.
    environment: release
    permissions:
      # contents:write — softprops/action-gh-release writes the GitHub Release
      #   with the default GITHUB_TOKEN (403s without this, regardless of the
      #   repo's default Workflow permissions).
      # id-token:write — `npm publish --provenance` signs the package via
      #   sigstore/OIDC so users can verify it was built by THIS workflow run.
      contents: write
      id-token: write
    steps:
      # Pin every action to a commit SHA (supply chain): a moved tag cannot swap
      # the action out from under a release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # need full history for git log on the tagged commit

      # Node 22+ required — packages/orm/src/adapters/sqlite.ts imports
      # `node:sqlite` (Node 22 experimental, Node 24 stable).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches source version
        run: |
          VERSION="${GITHUB_REF_NAME}"
          SOURCE_VERSION="$(node -p 'require("./package.json").version')"
          test "$SOURCE_VERSION" = "$VERSION" || {
            echo "::error::Tag $VERSION does not match package.json $SOURCE_VERSION"
            exit 1
          }
          npx tsx test/versionConsistency.test.ts
          echo "Building verified version $VERSION"

      - name: Build package
        run: npm run build

      - name: Publish to npm
        # --provenance: cryptographically signs the package via sigstore so
        #   users can verify the build came from this exact workflow run on this
        #   exact commit. Requires the id-token:write permission above.
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract release notes from commit body
        run: |
          # Pull the tagged commit body (sans Co-Authored-By trailers and
          # trailing blank lines). The body is the narrative the maintainer
          # already writes for each release — piping it straight into the
          # GitHub release beats a bare "Full Changelog" link.
          git log -1 "${GITHUB_REF_NAME}" --pretty=%B \
            | awk '/^Co-Authored-By:/ { skip=1 } !skip { print }' \
            | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' \
            > /tmp/release-notes.md
          echo "── /tmp/release-notes.md ──"
          cat /tmp/release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: /tmp/release-notes.md
